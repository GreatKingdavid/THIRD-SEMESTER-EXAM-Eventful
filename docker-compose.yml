version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: eventful_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: eventful_user
      POSTGRES_PASSWORD: eventful_pass
      POSTGRES_DB: eventful_db
    ports:
      - "5432:5432"
    volumes:
      - eventful_pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: eventful_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  eventful_pg_data:
